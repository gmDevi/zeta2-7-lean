status:
  scope: >-
    Formalised: the complete proof of the theorem stated in Challenge.lean, including the prime
    number theorem (from a vendored Lean proof of the Wiener–Ikehara theorem) and all numerical
    inequalities and certificates of the growth and denominator bounds (checked in Lean by norm_num
    and by kernel reduction). Not formalised: the identification of zeta2 s with the Kubota–Leopoldt
    value ζ₂(s) = L₂(s, ω^(1−s)) (Lai–Sprang–Zudilin, Lemma 2.8). The Kubota–Leopoldt L-function is
    not defined in Lean here. The identification only involves a non-zero rational factor and does
    not affect irrationality. The sharper constants of docs/proof.md (the denominator exponent
    3.8808 and the growth rate 0.70670) are not formalised; the Lean proof uses 3.99 and 0.71, which
    suffice. The theorem gives no irrationality measure.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: Zeta2.Z7.zeta2_7_irrational_palomar
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies:
        - statement: >-
            zeta2 s = ζ₂(s) = L₂(s, ω^(1−s)) for integers s ≥ 2. This is needed only to read the
            theorem as a statement about the Kubota–Leopoldt value, not for its proof.
          source: "Lai–Sprang–Zudilin, A note on the irrationality of ζ₂(5), Lemma 2.8"

