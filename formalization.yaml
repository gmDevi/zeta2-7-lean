# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (https://github.com/mathlib-initiative/formalization.yaml), with the
# fields Palomar requires (https://github.com/PalomarRegistry/PalomarPolicy/blob/main/CONTRIBUTING.md).
version: "v0.4"

project:
  name: "The 2-adic zeta value ζ₂(7) is irrational"
  description: >-
    A Lean 4 and Mathlib proof that the 2-adic zeta value ζ₂(7) is irrational. The theorem has no
    hypotheses, and its proof uses only the axioms propext, Classical.choice and Quot.sound. The
    value is defined through the Volkenborn integral: zeta2 s = J(s−1)/((s−1)·2^s), where J(s) is
    the 2-adic limit of the Riemann sums 2^(−N) Σ_{x<2^N} (x+1/2)^(−s), so zeta2 7 = J(6)/768; the
    theorem also proves that these limits exist. By Lemma 2.8 of Lai, Sprang and Zudilin (IMRN 2026),
    zeta2 s is the Kubota–Leopoldt value ζ₂(s) = L₂(s, ω^(1−s)) for s ≥ 2. That identification is
    cited, not formalised; it only involves a non-zero rational factor, which does not affect
    irrationality. ζ₂(3) and ζ₂(5) are known to be irrational, and L. Lai (Int. J. Number Theory 2025)
    proved that at least one of ζ₂(7), ζ₂(9), ζ₂(11), ζ₂(13) is irrational; the theorem here implies
    that result and the two registered formalisations of the same maintainer for {ζ₂(7), ζ₂(9),
    ζ₂(11)} and {ζ₂(7), ζ₂(9)}. An unrefereed draft by C. D. Long claims, by a different method, that
    ζ₂(s) is irrational for every odd s with 3 ≤ s ≤ 29; it is not used here, and an internal review of it
    (docs/long_review.md) found a gap in its large-prime step, so we do not regard it as settling the
    question. No refereed proof that ζ₂(7) is irrational is known to us. The proof uses the linear forms
    S_n = ∫ R_n'''(t+1/2−n/2) dt = ρ_n + Z_n ζ₂(7) of the rational functions
    R_n(t) = (2t+n) Π_{m=1}^{6} Π_{c∈C_m} (t+1/2+c) / Π_{k=0}^{n} (t+k)^(a_k), with six nested
    well-poised numerator blocks C_m = [η_m n, (1−η_m) n − 1], η = (5, 7, 7, 9, 11, 13)/40, and pole
    orders a_k ∈ {1, 2, 3, 4} that ramp up from both ends; the evaluation at the centred point
    t + 1/2 − n/2 leaves ζ₂(7) as the only zeta value. The 2-adic size of S_n comes from Lai's and
    Sprang's Δ-calculus, and the size of the coefficients from residue-level Cauchy bounds and a
    certified maximum of an explicit potential. The odd part of the denominators is bounded by a
    residue-class analysis of the partial fractions (a class lemma, a kernel identity and per-pole
    bounds, evaluated on local models of the residue classes whose values are certified in Lean on
    finitely many intervals) and the prime number theorem, proved here from a vendored Lean proof of
    the Wiener–Ikehara theorem. If ζ₂(7) were rational, the valuations at the auxiliary prime
    ℓ = 19n/20 − 1 (an idea of Lai and Sprang) would make S_n non-zero for infinitely many n, and
    Lai's irrationality criterion gives the contradiction. The mathematics and the Lean code were
    produced by AI agents under human direction and have not been refereed.
  # Humans only: AI systems are credited in automation.methods, never here.
  authors:
    - "Gennaro Marco Devincenzis"
  responsible_maintainers:
    - "Gennaro Marco Devincenzis"
  license: "Apache-2.0"

classification:
  arxiv: [math.NT]
  msc2020: [11J72, 11S40, 11S80, 11M06]

sources:
  - title: >-
      The 2-adic zeta value ζ₂(7) is irrational (informal proof in docs/proof.md of this repository)
    type: original-proof
    id: "docs/proof.md (this repository)"
    relationship: other
    note: >-
      The proof is presented here, by the informal proof docs/proof.md and this Lean formalisation.
      Both were produced by AI agents under the direction of the maintainer (see automation) and
      have not been refereed. This is not a claim to be the first proof of the result: the
      unrefereed draft of C. D. Long listed below claims the irrationality of ζ₂(7), among other
      values, by a different method; it is not used here, and our internal review of it (docs/long_review.md)
      found a gap in its large-prime step (see that source). No refereed
      proof that ζ₂(7) is irrational is known to us. Literature search (2026-09-26, by AI agents):
      arXiv (listings and the author pages of Lai, Sprang and Zudilin), OpenAlex (since 2025-06),
      GitHub, Lai's homepage, the blog Persiflage (2026-08-23 to 2026-09-24) and a web search; it
      complements the searches of 2026-09-24 for the {7, 9, 11} result (Zenodo, zbMATH, OpenAlex,
      Crossref, GitHub, talks and blogs). It found no refereed paper and no arXiv preprint proving
      that ζ₂(7) is irrational. Google Scholar, MathSciNet, zbMATH full text and Lai's thesis were
      not searched. docs/proof.md §1 lists the published tools it uses, and README.md lists how the
      Lean proof differs from it (weaker constants, its own certificates).

  - title: "On the irrationality of certain 2-adic zeta values"
    authors: ["Li Lai"]
    type: paper
    id: "https://doi.org/10.1142/S1793042125500113"
    location: >-
      Int. J. Number Theory 21 (2025), no. 1, 207–235; arXiv:2304.00816. Theorem 1.1 (case s = 3);
      Lemma 2.1 (irrationality criterion); Definition 2.3 and Lemmas 2.4–2.5 (the operators Δ and
      Δ_m).
    relationship: other
    note: >-
      Prior result that the recorded theorem strengthens: Theorem 1.1 with s = 3 shows that at least
      one of ζ₂(7), ζ₂(9), ζ₂(11), ζ₂(13) is irrational. The proof uses this paper's irrationality
      criterion and its Δ-operator bounds for Volkenborn integrals (after Sprang); these tools are
      restated and proved in Lean here (Zeta2Lean/Proofs). The paper's theorem itself is not
      formalised.
    author_endorsement: not-contacted

  - title: "A note on the irrationality of ζ₂(5)"
    authors: ["Li Lai", "Johannes Sprang", "Wadim Zudilin"]
    type: paper
    id: "https://doi.org/10.1093/imrn/rnag180"
    location: >-
      Int. Math. Res. Not. IMRN 2026, no. 16, rnag180; arXiv:2505.05005 (numbering of v2).
      Definition 2.7 and Lemma 2.8 (normalisation of ζ₂(s)); Lemma 2.4 (translation formula);
      Lemmas 2.5–2.6 (Δ-calculus).
    relationship: other
    note: >-
      Lemma 2.8, (s−1)⁻¹ ∫_{ℤ₂} (t+1/2)^(1−s) dt = 2^s ζ₂(s) for s ≥ 2 with ζ₂(s) = L₂(s, ω^(1−s)),
      identifies the Lean definition zeta2 with the Kubota–Leopoldt value. This is cited and not
      formalised. The proof follows this paper's Apéry-like approach (linear forms given by
      Volkenborn integrals of rational functions with poles at the non-positive integers) with a new
      rational function: centred evaluation, pole orders that ramp up from both ends and six nested
      well-poised numerator blocks. The translation formula and the Δ-calculus are proved in Lean
      here. The paper gives a new proof that ζ₂(5) is irrational.
    author_endorsement: not-contacted

  - title: "Many p-adic odd zeta values are irrational"
    authors: ["Li Lai", "Johannes Sprang"]
    type: paper
    id: "https://arxiv.org/abs/2306.10393"
    location: >-
      arXiv:2306.10393 (v2, 2025; to appear in Michigan Math. J.). Lemma 2.2 (irrationality
      criterion with auxiliary primes ℓ(n)).
    relationship: other
    note: >-
      The nonvanishing step uses the idea of Lemma 2.2: if ζ₂(7) were rational, then at the
      auxiliary prime ℓ = 19n/20 − 1, where ρ_n has valuation −1 and the coefficient of ζ₂(7) is
      ℓ-integral, the linear form cannot vanish. The consequence needed here (Stmt_Nonvanishing7) is
      proved in Lean; the lemma is not formalised as stated in the paper.
    author_endorsement: not-contacted

  - title: >-
      The Wiener–Ikehara Tauberian theorem and the prime number theorem, in the Lean 4 proofs of
      mathlib4 pull requests #43046, #43233 and #43238
    authors:
      - "Jose Francisco Antonio Balderas"
      - "Vincent Beffara"
      - "Alex Kontorovich"
      - "Terence Tao"
      - "Ruben Van de Velde"
      - "Arend Mellendijk"
      - "Alastair Irving"
    type: other
    id: "https://github.com/leanprover-community/mathlib4/pull/43238"
    location: >-
      Head commit 78e1b2bbd0d256081c926fccada84fd084653286 of pull request #43238, which contains
      #43046 and #43233 (open, not merged in Mathlib when this repository was prepared). Authors as
      in the file headers.
    relationship: other
    note: >-
      This source is Lean code, not a paper, hence type other; the pull requests are also listed
      under related_formalizations. The prime number theorem ψ(x)/x → 1 is needed for the bound on
      the odd part of the denominators (through θ(x)/x → 1). It is proved in Lean here
      (Zeta2.PNT_proof) from the Wiener–Ikehara theorem, whose Lean proof is vendored, with porting
      notes and the upstream Apache-2.0 headers, in Zeta2Lean/Cited/Vendor/PNT. The derivation of
      the prime number theorem follows WeakPNT.lean of #43238. The pull requests are by Terence Tao
      and adapt code of the PrimeNumberTheoremAnd project (see related_formalizations). This is an
      ingredient of the proof, not the recorded result.
    license: "Apache-2.0"
    author_endorsement: not-contacted

  - title: "Irrationality of certain p-adic periods for small p"
    authors: ["Frank Calegari"]
    type: paper
    id: "https://doi.org/10.1155/IMRN.2005.1235"
    location: "Int. Math. Res. Not. 2005, no. 20, 1235–1249; arXiv:math/0408214"
    relationship: background
    note: "Irrationality of ζ₂(3) (and ζ₃(3)). Context: the smallest 2-adic zeta values."

  - title: "Irrationality of some p-adic L-values"
    authors: ["Frits Beukers"]
