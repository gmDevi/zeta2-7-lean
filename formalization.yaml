          under related_formalizations. The research behind this result ran on 2026-09-25 and
          2026-09-26 (the informal proof was assembled on 2026-09-26), and its Lean development ran
          from 2026-09-26 to 2026-09-28 (the published history starts from a single squashed
          commit).
        spend_usd: "not tracked"
        hardware: >-
          Anthropic API models; Lean builds and exact-arithmetic Python computations on a local
          workstation (32 threads, 56 GB of memory for the Linux environment)
    - method: autonomous
      framework: "Claude Code subagents launched by workflow scripts"
      tool_setup: >-
        Research subagents found the construction (a genetic search over pole-order ramps and nested
        numerator blocks, with exact-arithmetic verification) and proved its ingredients in separate
        tracks: the denominator theorem (with a second, independent denominator proof), and the
        growth, 2-adic size and nonvanishing theorems. An adversarial verifier subagent with its own
        code confirmed each track, an assembler and final-referee subagent wrote docs/proof.md, an
        independent referee subagent checked it end to end, and a literature subagent searched for
        prior results. An architect subagent wrote the blueprint (BLUEPRINT_Z7.md), the definitions
        and statements (Zeta2Lean/Z7/Defs.lean, DenTable.lean, Statements.lean), the assembly and the
        exact-arithmetic mirror (python/z7_mirror.py); an auditor subagent checked the definitions
        and statements with independent code (python/z7_audit.py). Prover subagents, one per proof
        file, wrote the Lean proofs against frozen statements, including the generated certificates
        (HeadCert7, ResCert7, MaxU7) and their generators; integrator subagents built the project,
        ran the sorry and axiom census and replayed every module with Lean's leanchecker.
      prompting_notes: >-
        Task specifications were the statement docstrings and the "Workflow for provers" section of
        BLUEPRINT_Z7.md. Statements were frozen, and provers reported problems back instead of
        editing them.
  spend_usd: "not tracked"
  notes: >-
    The mathematics (the construction and the informal proof docs/proof.md) and all Lean code of
    this repository, except the vendored files in Zeta2Lean/Cited/Vendor/PNT (by Terence Tao and the
    PrimeNumberTheoremAnd contributors), were produced by AI agents (Anthropic Claude models; the
    commits are co-authored by Claude) under the direction of the human maintainer. The maintainer
    posed the research question that led to this work (the irrationality of odd zeta values),
    directed and supervised the runs, and is responsible for the submission. No human expert has
    checked the informal proof or the Lean statement. The history of each round is in STATUS_Z7.md
    and BLUEPRINT_Z7.md (commit hashes there refer to the unpublished development history).

fidelity:
  divergences: >-
    (1) zeta2 s is defined as J(s−1)/((s−1)·2^s) through the Volkenborn integral, not as the
    Kubota–Leopoldt value L₂(s, ω^(1−s)). The equality is Lai–Sprang–Zudilin Lemma 2.8, cited and not
    formalised. It only involves a non-zero rational factor, so it does not affect irrationality.
    Other normalisations of ζ₂(s), such as Coleman's or Furusho's with the Euler factor
    (1 − 2^(−s))⁻¹, also differ by a non-zero rational factor. (2) The Volkenborn integral is
    defined by Riemann sums over natural numbers and Mathlib's limUnder. The theorem therefore also
    proves that the Riemann sums of (x+1/2)^(−s) converge to J s, so no unspecified value of
    limUnder enters the statement. (3) "Rational" means "in the image of ℚ → ℚ_[2]". (4) The Lean
    proof follows the "Lean-friendly" variant of docs/proof.md (its §0.2 and §10): growth rate 0.71
    instead of 0.70670, denominator exponent 3.99 (the certified table gives 3.9241) instead of
    3.8808, its own kernel-checked certificates in place of the Python and interval-arithmetic
    computations of the informal proof, exact finite truncations in place of infinite q-adic series,
    certificate statements for primes q > 1000 (the informal proof uses q > 40), and Theorem N for
    all large n; README.md lists the differences. The informal proof cites the prime number theorem,
    which is proved in Lean here from vendored code of open mathlib4 pull requests (see sources).

review:
  status: agent-reviewed
  reviewers:
    - "AI auditor, verifier and referee subagents (Anthropic Claude models; AI systems, not human reviewers)"
  notes: >-
    Not peer-reviewed: no human expert has checked the informal proof (docs/proof.md) or the formal
    statement. Before submission: (1) every ingredient of docs/proof.md was proved in a research
    track and re-derived by an adversarial verifier subagent with its own code; the assembler refereed
    the whole (docs/proof.md §9), and an independent referee subagent reviewed it end to end. (2) An
    adversarial AI audit of the Lean definitions and statements (STATUS_Z7.md and BLUEPRINT_Z7.md,
    "Adversarial audit") checked faithfulness to docs/proof.md, casts, junk values and vacuity, and
    re-tested every statement with an independent script, python/z7_audit.py (700,181 checks, 0
    failures; logs in python/). (3) The sorry and axiom census (scripts/audit.sh); #print axioms of
    the main theorems lists only propext, Classical.choice and Quot.sound; all 70 modules of the proof
    were replayed with Lean's leanchecker on 2026-09-28, before the port to the module system (see
    (5)), and all 71 modules of Solution again after the port and the kernel-memory change. (4) On 2026-09-28, after the port, a local reproduction of Palomar's mechanical check (lake
    comparator, Challenge.lean compiled outside Lake against Mathlib only; unsandboxed) found the
    statements of Challenge.lean and Solution.lean identical and rejected two altered copies of
    Challenge.lean (zeta2 9 in place of zeta2 7; ∃ q : ℤ in place of ∃ q : ℚ). Its kernel replays did
    not finish at first: the con-ron checker ran out of memory on the generated certificates. After
    these were cut into small kernel checks (no statement changed; STATUS_Z7.md, "Kernel memory"), the
    same reproduction in a 32 GB memory cgroup also completed the kernel replays of con-ron (16
    workers), NanoDa and Lean's kernel, which accepted the proof. An independent verifier subagent
    repeated this run on the final version (accepted; con-ron peak 13.1 GiB) and saw two further
    altered copies rejected (a changed definition; a dropped conjunct) (STATUS_Z7.md,
    "Pre-publication audit"). (5)
    Before publication the unused files of the pair copy were removed and every Lean file was ported
    to Lean's module system. A declaration-level comparison with the development history showed that
    the removal changed no remaining declaration (the type and value hashes of all 4592 remaining
    constants are identical), and that after the port every remaining constant has the same kind and
    type, every definition the same value apart from proof terms, and theorems differ only in proofs
    that refer to auxiliary constants which the module system names differently. The generators
    reproduce the generated files byte for byte, and Palomar's source-requirement check
    (PalomarSubmission 65f0154) passes.

