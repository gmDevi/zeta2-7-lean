  - title: >-
      p-adic Eisenstein series, arithmetic holonomicity criteria, and irrationality of the 2-adic
      period ζ₂(5)
    authors: ["Frank Calegari", "Vesselin Dimitrov", "Yunqing Tang"]
    type: other
    id: "https://people.maths.ox.ac.uk/newton/lnts/VDimitrov-LNT.pdf"
    location: >-
      Slides of a talk by V. Dimitrov (12 June 2020) on joint work with F. Calegari and Y. Tang; see
      also F. Calegari, V. Dimitrov, Y. Tang, Arithmetic holonomy bounds and effective Diophantine
      approximation, arXiv:2510.04156 (2025). Lai–Sprang–Zudilin cite both (references [9] and [12]
      of arXiv:2505.05005v2) for the irrationality of ζ₂(5).
    relationship: background
    note: >-
      Talk slides, with the later arXiv paper named in location. Irrationality of ζ₂(5). Context:
      ζ₂(3) and ζ₂(5) are known to be irrational.

  - title: "Hybrid arithmetic holonomy and twenty-two individual p-adic zeta values"
    authors: ["Christopher D. Long"]
    type: other
    id: "https://github.com/octonion/p-adic-zeta-irrationality"
    location: >-
      Commit b46a1770901551961710e155d775aae7c5ea39e7 (2026-08-25): README.md and
      hybrid_arithmetic_holonomy.pdf.
    relationship: background
    note: >-
      Unrefereed draft in a GitHub repository. It claims, by a different method (arithmetic
      holonomy), that ζ₂(s) is irrational for every odd s with 3 ≤ s ≤ 29 (and ζ₃(s) for odd
      3 ≤ s ≤ 11, ζ₅(3), ζ₅(5) and ζ₇(3)), which includes the recorded result. It is not used here,
      and its README says that independent specialist review remains appropriate before publication.
      An internal review by the maintainer's AI agents (docs/long_review.md, 2026-09-28; not a
      refereed report; the author has not been contacted) could not verify it: the torsor
      decomposition (TeX lines 887-898) and Prop. 'Torsor Cartier strictness' (1677-1750) do not
      appear to hold for the Eisenstein-Eichler leaf (exact Pade computations exhibit large-prime
      poles outside the claimed window), and with the large-prime cost that the argument does
      support only zeta_2(3), zeta_2(5), zeta_3(3) and zeta_5(3) keep a positive margin. The draft's
      other steps and all 22 of its printed margins were reproduced.
    author_endorsement: not-contacted

